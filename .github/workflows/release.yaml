name: release

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 0.0.1)
        required: true
        type: string
      branch:
        description: Branch to release
        required: true
        default: main
        type: string

jobs:
  build:
    name: Test and build Windows executables
    runs-on: windows-2025
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      bridgeVersion: ${{ steps.version.outputs.bridgeVersion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false

      - name: Validate the release version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi
          echo "bridgeVersion=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Record the commit that is built and tagged
        id: commit
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GNU make
        run: choco install make --no-progress -y

      - name: Vet and test
        shell: bash
        run: |
          make vet
          make test

      - name: Build release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.bridgeVersion }}
        run: make build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-artifacts
          path: dist/
          if-no-files-found: error

  tag:
    name: Tag and create draft release
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    outputs:
      githubTag: v${{ needs.build.outputs.bridgeVersion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0

      - name: Create and push tag
        shell: bash
        env:
          RELEASE_TAG: v${{ needs.build.outputs.bridgeVersion }}
          BUILD_COMMIT: ${{ needs.build.outputs.commit }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          git config --local user.name "$ACTOR"
          git config --local user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$BUILD_COMMIT"
          git push origin "$RELEASE_TAG"

      - name: Create draft release
        shell: bash
        env:
          RELEASE_TAG: v${{ needs.build.outputs.bridgeVersion }}
          PRERELEASE: ${{ contains(needs.build.outputs.bridgeVersion, '-') }}
        run: |
          set -euo pipefail
          args=(--draft --title "$RELEASE_TAG" --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}"

  publish:
    name: Upload assets and publish release
    needs: [build, tag]
    runs-on: windows-2025
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-artifacts
          path: dist

      - name: Upload assets and publish
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.githubTag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check checksums.txt
          gh release upload "$RELEASE_TAG" \
            wslc-bridge-windows-amd64.exe \
            wslc-bridge-windows-arm64.exe \
            checksums.txt \
            bridge-manifest.json \
            --clobber
          gh release edit "$RELEASE_TAG" --draft=false
