name: next-build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish the next pre-release
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute the next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          echo "bridgeVersion=${base#v}-next.$(date -u +%Y%m%d%H%M)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install GNU make
        run: choco install make --no-progress -y

      - name: Build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.bridgeVersion }}
        run: make build

      - name: Point the next tag at this commit
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/next" \
            -f sha="$GITHUB_SHA" -F force=true 2>/dev/null ||
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/next" -f sha="$GITHUB_SHA"

      - name: Publish the next pre-release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: next
          name: next
          body: "Rolling build of main at ${{ github.sha }} (${{ steps.version.outputs.bridgeVersion }})."
          prerelease: true
          allowUpdates: true
          artifacts: "dist/wslc-bridge-windows-amd64.exe,dist/wslc-bridge-windows-arm64.exe,dist/checksums.txt,dist/bridge-manifest.json"
          artifactErrorsFailBuild: true
